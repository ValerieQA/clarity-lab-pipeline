# Temporary diagnostic. Manual dispatch only — no schedule, no trigger of any kind.
#
# Answers one question for the social-publishing-engine Wix design
# (ValerieQA/social-publishing-engine#68): does Wix preserve an explicitly supplied
# `seoSlug` through publish, including on collision? The engine's ambiguity recovery
# depends on the answer, and the documentation does not state it.
#
# Phase A creates two drafts and deletes them — nothing publicly visible. Phase B is opt-in
# and briefly publishes, then deletes. Delete this workflow once the answer is recorded.
name: Wix slug probe (temporary)

on:
  workflow_dispatch:
    inputs:
      run_phase_b:
        description: >-
          Also publish and delete (phase B). Leave false to check drafts only,
          which is enough to disprove the contract but not to confirm it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wix-slug-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe
        env:
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          RUN_PHASE_B: ${{ inputs.run_phase_b }}
        run: python scripts/wix_slug_probe.py
