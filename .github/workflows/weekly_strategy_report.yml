name: Clarity Lab — Weekly Strategy Report

on:
  schedule:
    - cron: '0 19 * * 5'   # Every Friday 19:00 UTC (22:00 Kyiv) — after all Friday posts
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send email report'
        required: false
        default: 'true'

jobs:
  weekly-report:
    name: Generate and email weekly strategy report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and email weekly strategy report
        env:
          WIX_SITE_ID:          ${{ secrets.WIX_SITE_ID }}
          WIX_API_KEY:          ${{ secrets.WIX_API_KEY }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          IG_TOKEN:             ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:        ${{ secrets.FB_PAGE_TOKEN }}
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:   ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GMAIL_SENDER:         ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:      ${{ secrets.REPORT_EMAIL_TO }}
          SEND_EMAIL_ALERTS:    ${{ github.event.inputs.send_email || 'true' }}
        run: python3 -m reports.weekly_strategy_report

      - name: Upload report artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-report-${{ github.run_id }}
          path: data/reports/weekly/
          retention-days: 90
