name: Clarity Lab — Retry Instagram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate only, do not publish)?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Retry Instagram publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN:   ${{ secrets.IG_TOKEN }}
          DRY_RUN:    ${{ github.event.inputs.dry_run }}
        run: |
          set -o pipefail
          FLAG=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && FLAG="--dry-run"
          python scripts/retry_instagram.py $FLAG 2>&1 | tee /tmp/retry_out.txt
          echo "## Instagram Retry — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/retry_out.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit updated topics.csv
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name  "Clarity Lab Bot"
          git config user.email "bot@inneros.online"
          git add topics.csv
          git diff --staged --quiet || git commit -m "📸 Instagram retry: $(date -u +'%Y-%m-%d %H:%M')"
          git push
