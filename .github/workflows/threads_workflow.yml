name: Clarity Lab — Threads Pipeline

on:
  schedule:
    # Runs Mon/Wed/Fri at 10:00 UTC (1hr after main pipeline)
    # + Tue/Thu at 14:00 UTC for independent posts
    - cron: '0 10 * * 1,3,5'
    - cron: '0 14 * * 2,4'

  workflow_dispatch:

jobs:
  publish_threads:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run Threads pipeline
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          THREADS_USER_ID:   ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN:     ${{ secrets.THREADS_TOKEN }}
        run: python threads.py
