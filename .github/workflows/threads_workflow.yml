name: Clarity Lab — Threads Draft Pipeline

on:
  schedule:
    - cron: '0 10 * * 1,3,5'
    - cron: '0 14 * * 2,4'
  workflow_dispatch:
    inputs:
      enable_threads_publishing:
        description: 'Publish to Threads? Leave false unless intentionally approved.'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  publish_threads:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run Threads draft pipeline
        env:
          OPENAI_API_KEY:             ${{ secrets.OPENAI_API_KEY }}
          THREADS_USER_ID:            ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN:       ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN:              ${{ secrets.THREADS_TOKEN }}
          THREADS_API_VERSION:        v1.0
          ENABLE_THREADS_PUBLISHING:  ${{ github.event.inputs.enable_threads_publishing || 'false' }}
          ENABLE_TOKEN_REFRESH:       'false'
        run: python threads.py

      - name: Commit Threads drafts
        run: |
          git config --global user.name "Clarity Lab Bot"
          git config --global user.email "bot@inneros.online"
          git add data/threads_posts.csv
          git diff --staged --quiet || git commit -m "🧵 Threads draft: $(date +'%Y-%m-%d')"
          git push
