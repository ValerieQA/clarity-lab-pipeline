name: Clarity Lab — Content Pipeline

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:    ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          WIX_SITE_ID:           ${{ secrets.WIX_SITE_ID }}
          WIX_API_KEY:           ${{ secrets.WIX_API_KEY }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          IG_TOKEN:              ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:         ${{ secrets.FB_PAGE_TOKEN }}
        run: python pipeline.py
      - name: Commit updated topics.csv
        run: |
          git config --global user.name "Clarity Lab Bot"
          git config --global user.email "bot@inneros.online"
          git add topics.csv
          git diff --staged --quiet || git commit -m "✅ Published: $(date +'%Y-%m-%d')"
          git push
