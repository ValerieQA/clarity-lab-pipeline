name: Clarity Lab — Content Pipeline

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Random delay (0–30 min)
        run: python -c "import random,time; d=random.randint(0,1800); print(f'Sleeping {d}s ({d//60}m {d%60}s)'); time.sleep(d)"
      - name: Run pipeline
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:    ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          WIX_SITE_ID:           ${{ secrets.WIX_SITE_ID }}
          WIX_API_KEY:           ${{ secrets.WIX_API_KEY }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          IG_TOKEN:              ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:         ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN:               'false'
          ENABLE_WIX_PUBLISHING: 'true'
          ENABLE_INSTAGRAM_PUBLISHING: 'true'
          ENABLE_FACEBOOK_PUBLISHING: 'true'
          ENABLE_THREADS_PUBLISHING: 'false'
          ENABLE_TOKEN_REFRESH:  'false'
        run: python pipeline.py
      - name: Commit updated topics.csv
        run: |
          git config --global user.name "Clarity Lab Bot"
          git config --global user.email "bot@inneros.online"
          git add topics.csv
          git diff --staged --quiet || git commit -m "✅ Published: $(date +'%Y-%m-%d')"
          git push

  notify_on_failure:
    name: Email alert on failure
    runs-on: ubuntu-latest
    needs: publish
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - name: Send failure email
        env:
          NOTIFY_EMAIL:       ${{ secrets.NOTIFY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL:            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import csv, os, smtplib
          from email.mime.text import MIMEText
          from pathlib import Path

          email    = os.environ["NOTIFY_EMAIL"]
          password = os.environ["GMAIL_APP_PASSWORD"]
          run_url  = os.environ["RUN_URL"]

          # Read per-channel status from topics.csv
          rows = []
          try:
              with open("topics.csv", newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
          except Exception:
              pass

          topic = rows[-1] if rows else {}
          channels = ["Wix", "Instagram", "Facebook", "Threads"]
          status_lines = "\n".join(
              f"  {c}: {topic.get(f'{c} Status', 'unknown')}" for c in channels
          )
          errors = topic.get("Publication Errors", "none")
          title  = topic.get("Topic / Working Title", "unknown")

          body = f"""Clarity Lab pipeline finished with partial failure.

          Topic: {title}

          Channel status:
          {status_lines}

          Errors:
            {errors}

          Run logs: {run_url}

          Use Actions → Retry Channel to republish the failed platform.
          """

          msg = MIMEText(body)
          msg["Subject"] = f"⚠️ Clarity Lab pipeline partial failure — {title[:40]}"
          msg["From"]    = f"Clarity Lab Bot <{email}>"
          msg["To"]      = email

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(email, password)
              smtp.send_message(msg)
          print("Email sent.")
          EOF
