name: Clarity Lab — Content Pipeline

on:
  schedule:
    - cron: '0 9 * * 1,3,5'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Random delay (0–30 min)
        run: python -c "import random,time; d=random.randint(0,1800); print(f'Sleeping {d}s ({d//60}m {d%60}s)'); time.sleep(d)"
      - name: Run pipeline
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:    ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          WIX_SITE_ID:           ${{ secrets.WIX_SITE_ID }}
          WIX_API_KEY:           ${{ secrets.WIX_API_KEY }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          IG_TOKEN:              ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN:         ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN:               'false'
          ENABLE_WIX_PUBLISHING: 'true'
          ENABLE_INSTAGRAM_PUBLISHING: 'true'
          ENABLE_FACEBOOK_PUBLISHING: 'true'
          ENABLE_THREADS_PUBLISHING: 'false'
          ENABLE_TOKEN_REFRESH:  'false'
        run: python pipeline.py
      - name: Commit updated topics.csv
        run: |
          git config --global user.name "Clarity Lab Bot"
          git config --global user.email "bot@inneros.online"
          git add topics.csv
          git diff --staged --quiet || git commit -m "✅ Published: $(date +'%Y-%m-%d')"
          git push

  notify_on_failure:
    name: Email alert on failure
    runs-on: ubuntu-latest
    needs: publish
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "⚠️ Clarity Lab pipeline failed — ${{ github.run_id }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: Clarity Lab Bot <${{ secrets.NOTIFY_EMAIL }}>
          body: |
            One or more platforms failed in the Clarity Lab content pipeline.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Check the logs for details on which platform failed and why.
