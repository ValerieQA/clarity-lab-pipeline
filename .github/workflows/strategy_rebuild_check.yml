name: Clarity Lab — Strategy Rebuild Check

on:
  schedule:
    - cron: '30 10 * * 1,3,5'  # After pipeline days (Mon/Wed/Fri 10:30 UTC)
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force strategy rebuild even if inventory is healthy'
        required: false
        default: 'false'

jobs:
  inventory-check:
    name: Check topic inventory
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
      remaining: ${{ steps.check.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check topic inventory
        id: check
        env:
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
          SEND_EMAIL_ALERTS:  'false'
        run: |
          python3 -c "
          import json, os, sys
          sys.path.insert(0, '.')
          from strategy.topic_inventory import load_inventory
          inv = load_inventory()
          print(json.dumps(inv, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'status={inv[\"status\"]}\n')
              f.write(f'remaining={inv[\"remaining_topics\"]}\n')
          "

  strategy-rebuild:
    name: Run strategy rebuild
    runs-on: ubuntu-latest
    needs: inventory-check
    if: |
      needs.inventory-check.outputs.status == 'warning' ||
      needs.inventory-check.outputs.status == 'critical' ||
      github.event.inputs.force_rebuild == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy analyzer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -m strategy.strategy_analyzer
        continue-on-error: true

      - name: Run research generator
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
          SEND_EMAIL_ALERTS:  'false'
        run: |
          TRIGGER="low_inventory"
          if [ "${{ needs.inventory-check.outputs.remaining }}" = "0" ]; then
            TRIGGER="cycle_complete"
          fi
          python3 -m strategy.research_generator --trigger $TRIGGER --no-email
        continue-on-error: true

      - name: Run strategy rebuilder and email proposal
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
          SEND_EMAIL_ALERTS:  'true'
        run: |
          TRIGGER="low_inventory"
          if [ "${{ needs.inventory-check.outputs.remaining }}" = "0" ]; then
            TRIGGER="cycle_complete"
          fi
          python3 -m strategy.strategy_rebuilder --trigger $TRIGGER

      - name: Block publishing alert if no topics
        if: needs.inventory-check.outputs.status == 'critical'
        env:
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          python3 -c "
          from notifications.email_reporter import send_critical_alert
          send_critical_alert(
              'CRITICAL: No unpublished topics remaining in topics.csv.\n\n'
              'Publishing is blocked until a new strategy is approved.\n\n'
              'A new strategy proposal has been generated and emailed separately.\n'
              'Review and approve it via: .github/workflows/approve_strategy.yml'
          )
          "

      # Commit proposed files to repo so approve_strategy.yml can find them.
      # Safety: only proposed_* files are committed. topics.csv is never touched here.
      - name: Commit proposed strategy files to repository
        env:
          GH_TOKEN_WRITER: ${{ secrets.GH_TOKEN_WRITER }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only proposed_* files — never topics.csv or current_strategy_state.json
          git add data/strategy/proposed_strategy_*.md   || true
          git add data/strategy/proposed_topics_*.csv    || true
          git add data/strategy/proposed_strategy_*.json || true
          git add data/strategy/strategy_diagnosis_*.md  || true
          git add data/strategy/strategy_diagnosis_*.json || true
          git add data/strategy/research_brief_*.md      || true
          git add data/strategy/research_brief_*.json    || true

          # Only commit if there is something staged
          if git diff --cached --quiet; then
            echo "No new proposed files to commit."
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN_WRITER}@github.com/${{ github.repository }}.git"
            git commit -m "Add proposed strategy and topics for review

          Generated by strategy_rebuild_check.yml (run ${{ github.run_id }}).
          Review and approve via approve_strategy.yml before activation.
          topics.csv was NOT modified."
            git push origin HEAD:main
          fi

      - name: Upload strategy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-rebuild-${{ github.run_id }}
          path: data/strategy/
          retention-days: 90
