name: Clarity Lab — Strategy Rebuild Check

on:
  schedule:
    - cron: '30 10 * * 1,3,5'  # After pipeline days (Mon/Wed/Fri 10:30 UTC)
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force strategy rebuild even if inventory is healthy'
        required: false
        default: 'false'

jobs:
  inventory-check:
    name: Check topic inventory
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.check.outputs.status }}
      remaining: ${{ steps.check.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check topic inventory
        id: check
        env:
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
          SEND_EMAIL_ALERTS:  'false'
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, '.')
          from strategy.topic_inventory import load_inventory
          inv = load_inventory()
          print(json.dumps(inv, indent=2))
          with open('\$GITHUB_OUTPUT', 'a') as f:
              f.write(f'status={inv[\"status\"]}\n')
              f.write(f'remaining={inv[\"remaining_topics\"]}\n')
          "

  strategy-rebuild:
    name: Run strategy rebuild
    runs-on: ubuntu-latest
    needs: inventory-check
    if: |
      needs.inventory-check.outputs.status == 'warning' ||
      needs.inventory-check.outputs.status == 'critical' ||
      github.event.inputs.force_rebuild == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strategy analyzer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 -m strategy.strategy_analyzer
        continue-on-error: true

      - name: Run research generator
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
          SEND_EMAIL_ALERTS:  'false'
        run: |
          TRIGGER="low_inventory"
          if [ "${{ needs.inventory-check.outputs.remaining }}" = "0" ]; then
            TRIGGER="cycle_complete"
          fi
          python3 -m strategy.research_generator --trigger $TRIGGER --no-email
        continue-on-error: true

      - name: Run strategy rebuilder and email proposal
        env:
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
          SEND_EMAIL_ALERTS:  'true'
        run: |
          TRIGGER="low_inventory"
          if [ "${{ needs.inventory-check.outputs.remaining }}" = "0" ]; then
            TRIGGER="cycle_complete"
          fi
          python3 -m strategy.strategy_rebuilder --trigger $TRIGGER

      - name: Block publishing alert if no topics
        if: needs.inventory-check.outputs.status == 'critical'
        env:
          GMAIL_SENDER:       ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO:    ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          python3 -c "
          from notifications.email_reporter import send_critical_alert
          send_critical_alert(
              'CRITICAL: No unpublished topics remaining in topics.csv.\n\n'
              'Publishing is blocked until a new strategy is approved.\n\n'
              'A new strategy proposal has been generated and emailed separately.\n'
              'Review and approve it via: .github/workflows/approve_strategy.yml'
          )
          "

      - name: Upload strategy artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strategy-rebuild-${{ github.run_id }}
          path: data/strategy/
          retention-days: 90
